<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#15283b"><title>PDF-sorteraren</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172638;background:#f3f6f9}*{box-sizing:border-box}
body{margin:0}header{background:#15283b;color:white;padding:16px max(16px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:1.25rem;margin:0}main{max-width:1100px;margin:auto;padding:20px 14px 70px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:16px}button,.file-label{border:0;border-radius:9px;padding:12px 15px;font:inherit;font-weight:600;cursor:pointer;background:#e2e9f0;color:#14263a}button:disabled{opacity:.4;cursor:not-allowed}.primary,.file-label{background:#1765b3;color:white}.danger{background:#fce8e8;color:#a02424}.hint{color:#52677b;font-size:.91rem;margin:10px 0 16px}.drop{border:2px dashed #a6b9cb;border-radius:13px;background:white;padding:28px 15px;text-align:center;margin-bottom:15px}.drop.over{background:#e1f0ff;border-color:#1765b3}.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:13px}.page{background:white;border:2px solid transparent;border-radius:12px;padding:9px;box-shadow:0 2px 8px #17263814;min-width:0;touch-action:pan-y}.page.selected{border-color:#1765b3;background:#eaf4ff}.preview{height:178px;display:flex;justify-content:center;align-items:center;background:#e8edf2;border-radius:6px;overflow:hidden;cursor:pointer}.preview canvas{max-width:100%;max-height:100%;object-fit:contain}.meta{font-size:.76rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#52677b;margin:8px 0 5px}.actions{display:flex;justify-content:space-between;gap:3px}.actions button{padding:7px 8px;font-size:.85rem}.count{font-size:.9rem;color:#536779}.drag-handle{cursor:grab;user-select:none;touch-action:none;padding:7px 0;text-align:center;color:#52677b;font-size:.85rem}.sortable-ghost{opacity:.35}.sortable-chosen{box-shadow:0 6px 18px #1765b355}.busy{font-weight:600;color:#1765b3;min-height:24px}.empty{color:#52677b;text-align:center;padding:22px}.file-label input{display:none}@media(max-width:450px){.pages{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.preview{height:155px}main{padding:13px 9px}.page{padding:6px}.toolbar button,.file-label{padding:11px}}
</style></head><body>
<header><h1>📄 PDF-sorteraren</h1><span id="counter" class="count" style="color:#d5e5f5">0 sidor</span></header>
<main><div class="toolbar"><label class="file-label">＋ Lägg till PDF<input id="files" type="file" accept="application/pdf,.pdf" multiple></label><button id="save" class="primary" disabled>Spara gemensam PDF</button><button id="undo" disabled>Ångra</button><button id="clear" class="danger" disabled>Rensa allt</button></div>
<div class="drop" id="drop"><strong>Släpp PDF-filer här</strong><div class="hint">Eller tryck på ”Lägg till PDF”. Filerna behandlas lokalt i webbläsaren.</div></div>
<p class="hint">Dra i handtaget ⠿ för att ändra ordning (även med fingret). Använd pilarna för finjustering. Tryck på en miniatyr för att markera sidan.</p>
<div id="status" class="busy" role="status" aria-live="polite"></div><section class="pages" id="pages" aria-label="PDF-sidor"></section><div id="empty" class="empty">Inga sidor ännu.</div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.6/Sortable.min.js"></script>
<script>
(function(){
'use strict';
const pdfjs=window.pdfjsLib, lib=window.PDFLib;
const status=document.getElementById('status'), grid=document.getElementById('pages');
const files=document.getElementById('files'), save=document.getElementById('save'), undo=document.getElementById('undo'), clear=document.getElementById('clear');
const drop=document.getElementById('drop');let pages=[],sources=new Map(),history=[],nextId=0,busy=false;
pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
function message(s){status.textContent=s}
function snapshot(){history.push(pages.map(p=>({...p})));if(history.length>30)history.shift()}
function sync(){document.getElementById('counter').textContent=pages.length+' sidor';document.getElementById('empty').hidden=pages.length>0;save.disabled=busy||!pages.length;clear.disabled=busy||!pages.length;undo.disabled=busy||!history.length;files.disabled=busy}
function makeCard(p){const el=document.createElement('article');el.className='page';el.dataset.id=p.id;
el.innerHTML='<div class="drag-handle" title="Dra för att flytta">⠿ Flytta</div><div class="preview" title="Markera sida"><canvas></canvas></div><div class="meta"></div><div class="actions"><button data-action="left" title="Flytta vänster">←</button><button data-action="rotate" title="Rotera 90°">↻</button><button data-action="delete" class="danger" title="Radera sida">✕</button><button data-action="right" title="Flytta höger">→</button></div>';
el.querySelector('.meta').textContent=p.name+' · sida '+(p.index+1);el.querySelector('.preview').onclick=()=>el.classList.toggle('selected');return el}
async function renderThumb(p,canvas){try{const doc=sources.get(p.source)?.preview;if(!doc)return;const page=await doc.getPage(p.index+1);const viewport=page.getViewport({scale:1,rotation:(page.rotate+p.rotation)%360});const scale=Math.min(160/viewport.width,175/viewport.height);const v=page.getViewport({scale,rotation:(page.rotate+p.rotation)%360});const ratio=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.ceil(v.width*ratio);canvas.height=Math.ceil(v.height*ratio);canvas.style.width=v.width+'px';canvas.style.height=v.height+'px';await page.render({canvasContext:canvas.getContext('2d'),viewport:page.getViewport({scale:scale*ratio,rotation:(page.rotate+p.rotation)%360})}).promise}catch(e){console.error(e)}}
function render(){grid.replaceChildren();for(const p of pages){const el=makeCard(p);grid.append(el);renderThumb(p,el.querySelector('canvas'))}sync()}
async function addFiles(list){if(busy)return;busy=true;sync();let added=0;for(const file of list){try{message('Läser '+file.name+' …');const bytes=new Uint8Array(await file.arrayBuffer());const preview=await pdfjs.getDocument({data:bytes.slice()}).promise;const key='src'+(++nextId);sources.set(key,{bytes,preview,name:file.name});for(let i=0;i<preview.numPages;i++){pages.push({id:'p'+(++nextId),source:key,index:i,rotation:0,name:file.name});added++}}catch(e){alert('Kunde inte öppna '+file.name+': '+e.message)}}busy=false;message(added?added+' sidor tillagda.':'');render()}
files.onchange=async()=>{if(files.files.length){snapshot();await addFiles(files.files)}files.value=''};
for(const ev of ['dragenter','dragover'])drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')});
for(const ev of ['dragleave','drop'])drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')});
drop.addEventListener('drop',async e=>{const f=[...e.dataTransfer.files].filter(x=>x.name.toLowerCase().endsWith('.pdf'));if(f.length){snapshot();await addFiles(f)}});
grid.addEventListener('click',e=>{const btn=e.target.closest('button[data-action]');if(!btn||busy)return;const card=btn.closest('.page');const i=pages.findIndex(p=>p.id===card.dataset.id);if(i<0)return;const action=btn.dataset.action;if(action==='left'&&i===0||action==='right'&&i===pages.length-1)return;snapshot();if(action==='delete')pages.splice(i,1);if(action==='rotate')pages[i].rotation=(pages[i].rotation+90)%360;if(action==='left'||action==='right'){const j=i+(action==='left'?-1:1);[pages[i],pages[j]]=[pages[j],pages[i]]}render()});
new Sortable(grid,{animation:160,handle:'.drag-handle',ghostClass:'sortable-ghost',chosenClass:'sortable-chosen',onStart(){if(!busy)snapshot()},onEnd(){const ids=[...grid.children].map(el=>el.dataset.id);const map=new Map(pages.map(p=>[p.id,p]));pages=ids.map(id=>map.get(id));render()}});
undo.onclick=()=>{if(!history.length||busy)return;pages=history.pop();message('Senaste ändringen ångrades.');render()};
clear.onclick=()=>{if(!confirm('Ta bort alla sidor från arbetsytan?'))return;snapshot();pages=[];message('Arbetsytan rensad.');render()};
save.onclick=async()=>{if(busy||!pages.length)return;busy=true;sync();try{message('Skapar PDF …');const out=await lib.PDFDocument.create();const docs=new Map();for(const p of pages){if(!docs.has(p.source))docs.set(p.source,await lib.PDFDocument.load(sources.get(p.source).bytes,{ignoreEncryption:false}));const [copied]=await out.copyPages(docs.get(p.source),[p.index]);if(p.rotation)copied.setRotation(lib.degrees(((copied.getRotation().angle+p.rotation)%360)));out.addPage(copied)}const bytes=await out.save();const blob=new Blob([bytes],{type:'application/pdf'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='sammanfogad.pdf';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);message('PDF skapad. Kontrollera dina hämtade filer.')}catch(e){alert('Kunde inte spara PDF: '+e.message);message('Export misslyckades.')}finally{busy=false;sync()}};
sync();
})();
</script></body></html>
